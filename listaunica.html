<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Única de Aniversários - NIVER</title>
  
  <style>
    :root {
      --primary: #ff4757;
      --secondary: #2ed573;
      --bg-color: #f1f2f6;
      --card-bg: #ffffff;
      --text: #2f3542;
      --accent: #70a1ff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .header-banner {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 2px dashed #eccc68;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      margin: 5px 0;
      font-size: 2.2em;
    }

    .status-bar {
      background: #eccc6822;
      border: 1px dashed #eccc68;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #d35400;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-bar {
      width: 100%;
      padding: 12px;
      border: 2px solid #dfe4ea;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
    }

    .search-bar:focus { border-color: var(--primary); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #dfe4ea;
    }

    th {
      background-color: #f8f9fa;
      color: #57606f;
    }

    .badge-folder {
      background-color: var(--accent);
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-agenda {
      background-color: var(--secondary);
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 30px;
      font-size: 1.2em;
      color: #747d8c;
    }

    .btn-refresh {
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      border-top: 2px dashed #eccc68;
      padding-top: 20px;
      font-size: 13px;
      color: #747d8c;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-banner">
    <h1>📋 Lista Única de Aniversários</h1>
    <p>Varredura consolidada de todas as pastas <strong>NIVER*</strong> no GitHub</p>
  </div>

  <!-- Barra de Status e Recarregamento -->
  <div class="status-bar">
    <span id="statusTexto">🔄 Buscando dados no GitHub...</span>
    <button class="btn-refresh" onclick="carregarTodasPastasNiver()">🔁 Atualizar</button>
  </div>

  <!-- Campo de Pesquisa Instantânea -->
  <input type="text" id="campoBusca" class="search-bar" placeholder="🔍 Pesquisar por nome, observação, pasta ou agenda..." onkeyup="filtrarTabela()">

  <!-- Tabela Consolidada -->
  <table>
    <thead>
      <tr>
        <th>Pasta / Origem</th>
        <th>Agenda</th>
        <th>Nome</th>
        <th>Data e Signo</th>
        <th>Observação</th>
      </tr>
    </thead>
    <tbody id="tabelaListaUnica">
      <tr>
        <td colspan="5" class="loading">Carregando aniversários...</td>
      </tr>
    </tbody>
  </table>

  <footer>
    © Copyright Reinaldo Pinheiro Consultoria
  </footer>
</div>

<script>
  // CONFIGURAÇÃO DO REPOSITÓRIO GITHUB
  const REPO_OWNER = "reinaldopinheiro";
  const REPO_NAME = "reinaldopinheiro.github.io";

  // Lista global que armazenará todos os registros unificados
  let todosOsAniversarios = [];

  // 1. Função de Inicialização
  async function carregarTodasPastasNiver() {
    const statusTexto = document.getElementById('statusTexto');
    const tbody = document.getElementById('tabelaListaUnica');
    
    statusTexto.innerText = "🔄 Varrendo a raiz do repositório...";
    tbody.innerHTML = '<tr><td colspan="5" class="loading">Buscando pastas NIVER...</td></tr>';
    todosOsAniversarios = [];

    try {
      // Busca o conteúdo da raiz do repositório no GitHub
      const urlRaiz = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
      const respRaiz = await fetch(urlRaiz);

      if (!respRaiz.ok) {
        throw new Error("Não foi possível acessar a raiz do repositório no GitHub.");
      }

      const itensRaiz = await respRaiz.json();

      // Filtra apenas diretórios (dir) cujo nome começa com "NIVER" (case insensitive)
      const pastasNiver = itensRaiz.filter(item => 
        item.type === 'dir' && item.name.toUpperCase().startsWith('NIVER')
      );

      if (pastasNiver.length === 0) {
        statusTexto.innerText = "⚠️ Nenhuma pasta começando com 'NIVER' foi encontrada na raiz.";
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nenhuma pasta encontrada.</td></tr>';
        return;
      }

      statusTexto.innerText = `📁 ${pastasNiver.length} pasta(s) NIVER encontrada(s). Lendo arquivos JSON...`;

      // 2. Percorre cada pasta encontrada
      for (const pasta of pastasNiver) {
        await processarPasta(pasta.name);
      }

      // Ordena por Nome em ordem alfabética na lista única
      todosOsAniversarios.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));

      statusTexto.innerText = `✅ Concluído! Total de ${todosOsAniversarios.length} registro(s) unificado(s).`;
      renderizarTabela(todosOsAniversarios);

    } catch (erro) {
      console.error(erro);
      statusTexto.innerText = "❌ Erro ao ler os dados do GitHub.";
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">${erro.message}</td></tr>`;
    }
  }

  // 2. Processa o conteúdo de uma pasta específica
  async function processarPasta(nomePasta) {
    try {
      const urlPasta = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${nomePasta}`;
      const respPasta = await fetch(urlPasta);

      if (!respPasta.ok) return;

      const arquivos = await respPasta.json();

      // Filtra arquivos com extensão .json
      const arquivosJson = arquivos.filter(arq => arq.type === 'file' && arq.name.endsWith('.json'));

      for (const arqJson of arquivosJson) {
        // Tenta ler o conteúdo bruto do arquivo JSON via download_url ou via raw
        const respConteudo = await fetch(arqJson.download_url + '?v=' + new Date().getTime());
        if (respConteudo.ok) {
          const dadosJson = await respConteudo.json();
          extrairEUnificarRegistros(dadosJson, nomePasta, arqJson.name);
        }
      }
    } catch (e) {
      console.warn(`Erro ao ler pasta ${nomePasta}:`, e);
    }
  }

  // 3. Normaliza e extrai a estrutura dos JSONs para a lista única
  function extrairEUnificarRegistros(dados, pastaOrigem, arquivoOrigem) {
    // Se a estrutura do JSON for de dicionário/múltiplas agendas: { "Trabalho": [...], "Amigos": [...] }
    if (dados && typeof dados === 'object' && !Array.isArray(dados)) {
      Object.keys(dados).forEach(nomeAgenda => {
        if (Array.isArray(dados[nomeAgenda])) {
          dados[nomeAgenda].forEach(item => {
            if (item.nome && item.dataNasc) {
              todosOsAniversarios.push({
                pasta: pastaOrigem,
                arquivo: arquivoOrigem,
                agenda: nomeAgenda,
                nome: item.nome,
                dataNasc: item.dataNasc,
                obs: item.obs || ""
              });
            }
          });
        }
      });
    } 
    // Se a estrutura do JSON for uma lista simples: [ { nome, dataNasc, obs }, ... ]
    else if (Array.isArray(dados)) {
      dados.forEach(item => {
        if (item.nome && item.dataNasc) {
          todosOsAniversarios.push({
            pasta: pastaOrigem,
            arquivo: arquivoOrigem,
            agenda: "Padrão",
            nome: item.nome,
            dataNasc: item.dataNasc,
            obs: item.obs || ""
          });
        }
      });
    }
  }

  // 4. Renderiza a Tabela na Tela
  function renderizarTabela(lista) {
    const tbody = document.getElementById('tabelaListaUnica');
    tbody.innerHTML = '';

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nenhum aniversário encontrado nas pastas.</td></tr>';
      return;
    }

    lista.forEach(item => {
      const partes = item.dataNasc.split('-');
      const mes = partes.length === 3 ? partes[1] : partes[0];
      const dia = partes.length === 3 ? partes[2] : partes[1];

      const dataFormatada = `${dia}/${mes}`;
      const signo = obterSigno(dia, mes);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="badge-folder">📁 ${item.pasta}</span></td>
        <td><span class="badge-agenda">${item.agenda}</span></td>
        <td><strong>${item.nome}</strong></td>
        <td>🎂 ${dataFormatada} &nbsp;<small style="color: #666;">(${signo})</small></td>
        <td>${item.obs}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 5. Filtro Instantâneo da Tabela
  function filtrarTabela() {
    const termo = document.getElementById('campoBusca').value.toLowerCase();
    
    const filtrados = todosOsAniversarios.filter(item => 
      item.nome.toLowerCase().includes(termo) ||
      item.obs.toLowerCase().includes(termo) ||
      item.pasta.toLowerCase().includes(termo) ||
      item.agenda.toLowerCase().includes(termo)
    );

    renderizarTabela(filtrados);
  }

  // Helper para Signos
  function obterSigno(dia, mes) {
    dia = parseInt(dia, 10);
    mes = parseInt(mes, 10);

    if ((mes == 3 && dia >= 21) || (mes == 4 && dia <= 19)) return "♈ Áries";
    if ((mes == 4 && dia >= 20) || (mes == 5 && dia <= 20)) return "♉ Touro";
    if ((mes == 5 && dia >= 21) || (mes == 6 && dia <= 20)) return "♊ Gêmeos";
    if ((mes == 6 && dia >= 21) || (mes == 7 && dia <= 22)) return "♋ Câncer";
    if ((mes == 7 && dia >= 23) || (mes == 8 && dia <= 22)) return "♌ Leão";
    if ((mes == 8 && dia >= 23) || (mes == 9 && dia <= 22)) return "♍ Virgem";
    if ((mes == 9 && dia >= 23) || (mes == 10 && dia <= 22)) return "♎ Libra";
    if ((mes == 10 && dia >= 23) || (mes == 11 && dia <= 21)) return "♏ Escorpião";
    if ((mes == 11 && dia >= 22) || (mes == 12 && dia <= 21)) return "♐ Sagitário";
    if ((mes == 12 && dia >= 22) || (mes == 1 && dia <= 19)) return "♑ Capricórnio";
    if ((mes == 1 && dia >= 20) || (mes == 2 && dia <= 18)) return "♒ Aquário";
    if ((mes == 2 && dia >= 19) || (mes == 3 && dia <= 20)) return "♓ Peixes";
    return "";
  }

  // Executa ao carregar
  carregarTodasPastasNiver();
</script>

</body>
</html>
