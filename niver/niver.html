<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIVER v2.1 - Controle de Aniversários por Agenda</title>
  <style>
    :root {
      --primary: #ff4757;
      --secondary: #2ed573;
      --bg-color: #f1f2f6;
      --card-bg: #ffffff;
      --text: #2f3542;
      --accent: #70a1ff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
    }

    .header-banner {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 2px dashed #eccc68;
      margin-bottom: 20px;
    }

    .header-banner img.logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--primary);
      margin: 5px 0;
      font-size: 2.2em;
    }

    .festive-decor {
      font-size: 2em;
      margin: 5px 0;
    }

    /* Seletor de Agendas */
    .agenda-section {
      background: #f8f9fa;
      border: 2px solid #eccc68;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .agenda-section label {
      font-weight: bold;
      color: var(--primary);
      font-size: 1.1em;
    }

    .agenda-section select {
      flex: 2;
      min-width: 180px;
      font-weight: bold;
      padding: 10px;
      border: 2px solid #dfe4ea;
      border-radius: 8px;
    }

    .btn-agenda {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Formulário */
    .form-group {
      display: grid;
      grid-template-columns: 2fr 1fr 2fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    @media (max-width: 650px) {
      .form-group { grid-template-columns: 1fr; }
      .agenda-section { flex-direction: column; align-items: stretch; }
    }

    input, select, button {
      padding: 12px;
      border: 2px solid #dfe4ea;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--primary); }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
      border: none;
      color: white;
      border-radius: 8px;
    }

    button:active { transform: scale(0.98); }
    .btn-save { background-color: var(--secondary); flex: 2; }
    .btn-export { background-color: #ffa502; flex: 1; }
    .btn-github { background-color: #2f3542; flex: 1; }
    .btn-clear { background-color: #747d8c; flex: 1; }

    .search-bar { width: 100%; margin-bottom: 15px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #dfe4ea;
    }

    th { background-color: #f8f9fa; color: #57606f; }

    .action-btns { display: flex; gap: 5px; }
    .btn-edit { background-color: #eccc68; padding: 6px 10px; font-size: 12px; }
    .btn-delete { background-color: #ff4757; padding: 6px 10px; font-size: 12px; }

    .badge-agenda {
      background-color: var(--accent);
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      border-top: 2px dashed #eccc68;
      padding-top: 20px;
      width: 100%;
    }

    .footer-logo { max-width: 120px; margin-bottom: 10px; }

    .pix-box {
      background: #f1f2f6;
      border: 2px dashed #2ed573;
      border-radius: 12px;
      padding: 15px;
      display: inline-block;
      margin: 15px 0;
      max-width: 340px;
    }

    .pix-qrcode {
      width: 160px;
      height: 160px;
      margin: 10px auto;
      display: block;
    }

    .copyright {
      font-size: 13px;
      color: #747d8c;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Cabeçalho -->
  <div class="header-banner">
    <img src="logo.png" alt="Logo Reinaldo Pinheiro" class="logo" onerror="this.style.display='none'">
    <div class="festive-decor">🎈 🎂 🎁 🥳 🎉</div>
    <h1>NIVER</h1>
    <small>Versão 2.1 | Data: 29/07/2026</small>
  </div>

  <!-- Seleção e Criação de Agendas -->
  <div class="agenda-section">
    <label for="agendaSelect">📁 Agenda Atual:</label>
    <select id="agendaSelect" onchange="trocarAgenda()"></select>
    <button class="btn-agenda" onclick="novaAgenda()">➕ Nova Agenda</button>
    <button class="btn-agenda" style="background-color: #ff4757;" onclick="excluirAgendaAtual()">🗑️ Excluir Agenda</button>
  </div>

  <!-- Form de Cadastro -->
  <input type="hidden" id="editIndex" value="-1">
  <div class="form-group">
    <input type="text" id="nome" placeholder="Nome do Aniversariante" required>
    <input type="date" id="dataNasc" required>
    <input type="text" id="obs" maxlength="50" placeholder="Observação (máx. 50 caract.)">
  </div>

  <div class="btn-group">
    <button class="btn-save" onclick="salvarAniversario()">💾 Salvar</button>
    <button class="btn-clear" onclick="limparFormulario()">🔄 Limpar</button>
    <button class="btn-export" onclick="exportarICS()">📅 Exportar p/ Calendário (.ics)</button>
    <button class="btn-export" style="background-color: #9b59b6;" onclick="exportarBackupJSON()">📥 Baixar JSON Local</button>
    <button class="btn-github" onclick="salvarNoGitHubDirect()">🚀 Salvar Direto no GitHub</button>
  </div>

  <!-- Campo de Busca -->
  <input type="text" id="campoBusca" class="search-bar" placeholder="🔍 Consultar nome, observação ou agenda..." onkeyup="consultarAniversarios()">

  <!-- Tabela -->
  <table>
    <thead>
      <tr>
        <th>Agenda</th>
        <th>Nome</th>
        <th>Data</th>
        <th>Observação</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaAniversarios"></tbody>
  </table>

  <!-- Rodapé -->
  <footer>
    <img src="logo.png" alt="Logo Reinaldo Pinheiro" class="footer-logo" onerror="this.style.display='none'">
    
    <div class="pix-box">
      <strong>🎁 Ajude a criar novos projetos</strong><br>
      <small>Chave PIX: doe@reinaldopinheiro.com.br</small><br>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=doe@reinaldopinheiro.com.br" alt="QRCode PIX Donate" class="pix-qrcode">
      <small><strong>QRCode PIX Donate</strong><br>Aponte a câmera do seu banco para o QRCode.</small>
    </div>

    <div class="copyright">
      © Copyright Reinaldo Pinheiro Consultoria
    </div>
  </footer>
</div>

<script>
  // -------------------------------------------------------------
  // CONFIGURAÇÃO DO TOKEN OFUSCADO (BASE64)
  // -------------------------------------------------------------
  // Cole o seu token do GitHub codificado em Base64 entre as aspas abaixo:
  const TOKEN_BASE64 = "Z2l0aHViX3BhdF8xMUJPWklVRUkwZUFyWG85NmxhTmpnXzN1cEpFU0MyUGh2UnF6Wnd1ZEIycko3eFVGdllMRVVqTkZPVWRQTldiWktQQ0lXUDJMNzh3b1ZkbjRY"; 

  function obterToken() {
    try {
      return atob(TOKEN_BASE64);
    } catch(e) {
      console.error("Erro ao decodificar token", e);
      return "";
    }
  }

  // Configurações do Repositório
  const REPO_OWNER = "reinaldopinheiro";
  const REPO_NAME = "reinaldopinheiro.github.io";
  const FILE_PATH = "niver/dados_niver.json";

  let baseAgendas = { "Geral": [] };
  let agendaAtual = "Geral";

  async function inicializar() {
    try {
      const resp = await fetch('dados_niver.json?v=' + new Date().getTime());
      if (resp.ok) {
        const dados = await resp.json();
        if (Array.isArray(dados)) {
          baseAgendas["Geral"] = dados;
        } else if (dados && typeof dados === 'object') {
          baseAgendas = dados;
        }
      }
    } catch (e) {
      const local = localStorage.getItem('niver_agendas_db');
      if (local) baseAgendas = JSON.parse(local);
    }

    atualizarSelectAgendas();
    renderizarTabela();
  }

  function atualizarSelectAgendas() {
    const select = document.getElementById('agendaSelect');
    select.innerHTML = '';
    const agendas = Object.keys(baseAgendas);
    if (agendas.length === 0) {
      baseAgendas["Geral"] = [];
      agendas.push("Geral");
    }

    agendas.forEach(nome => {
      const opt = document.createElement('option');
      opt.value = nome;
      opt.textContent = `📁 ${nome} (${baseAgendas[nome].length})`;
      if (nome === agendaAtual) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function trocarAgenda() {
    agendaAtual = document.getElementById('agendaSelect').value;
    renderizarTabela();
  }

  function novaAgenda() {
    const nome = prompt("Digite o nome da nova Agenda (Ex: Família, Trabalho, Amigos):");
    if (nome && nome.trim() !== "") {
      const nomeLimpo = nome.trim();
      if (!baseAgendas[nomeLimpo]) {
        baseAgendas[nomeLimpo] = [];
        agendaAtual = nomeLimpo;
        atualizarStorageLocal();
        atualizarSelectAgendas();
        renderizarTabela();
      } else {
        alert("Já existe uma agenda com esse nome!");
      }
    }
  }

  function excluirAgendaAtual() {
    if (Object.keys(baseAgendas).length <= 1) {
      alert("Você deve ter pelo menos uma agenda!");
      return;
    }

    if (confirm(`Tem certeza que deseja excluir a agenda "${agendaAtual}"?`)) {
      // BACKUP SILENCIOSO DA AGENDA ANTES DA EXCLUSÃO
      try {
        const agora = new Date();
        const dd = String(agora.getDate()).padStart(2, '0');
        const mm = String(agora.getMonth() + 1).padStart(2, '0');
        const aa = String(agora.getFullYear()).slice(-2);
        const hh = String(agora.getHours()).padStart(2, '0');
        const min = String(agora.getMinutes()).padStart(2, '0');
        const ss = String(agora.getSeconds()).padStart(2, '0');
        
        const timestamp = `${dd}${mm}${aa}${hh}${min}${ss}`;
        const nomeBackup = `backup_${agendaAtual.replace(/[^a-zA-Z0-9]/g, '_')}_${timestamp}`;

        const backupsExistentes = JSON.parse(localStorage.getItem('niver_backups_ocultos') || '{}');
        backupsExistentes[nomeBackup] = {
          dataExclusao: agora.toISOString(),
          agenda: agendaAtual,
          dados: baseAgendas[agendaAtual]
        };
        localStorage.setItem('niver_backups_ocultos', JSON.stringify(backupsExistentes));
      } catch (err) {
        console.error("Erro no backup silencioso", err);
      }

      // Exclusão normal da agenda
      delete baseAgendas[agendaAtual];
      agendaAtual = Object.keys(baseAgendas)[0];
      atualizarStorageLocal();
      atualizarSelectAgendas();
      renderizarTabela();
    }
  }

  function salvarAniversario() {
    const nome = document.getElementById('nome').value.trim();
    const dataNasc = document.getElementById('dataNasc').value;
    const obs = document.getElementById('obs').value.trim();
    const index = parseInt(document.getElementById('editIndex').value);

    if (!nome || !dataNasc) {
      alert('Preencha Nome e Data de Aniversário!');
      return;
    }

    const item = { nome, dataNasc, obs };
    if (!baseAgendas[agendaAtual]) baseAgendas[agendaAtual] = [];

    if (index === -1) {
      baseAgendas[agendaAtual].push(item);
    } else {
      baseAgendas[agendaAtual][index] = item;
    }

    atualizarStorageLocal();
    limparFormulario();
    atualizarSelectAgendas();
    renderizarTabela();
  }

  function renderizarTabela() {
    const tbody = document.getElementById('tabelaAniversarios');
    tbody.innerHTML = '';
    const termo = document.getElementById('campoBusca').value.toLowerCase();
    let listaParaExibir = [];

    if (termo !== "") {
      Object.keys(baseAgendas).forEach(nomeAgenda => {
        baseAgendas[nomeAgenda].forEach((item, index) => {
          if (item.nome.toLowerCase().includes(termo) || item.obs.toLowerCase().includes(termo) || nomeAgenda.toLowerCase().includes(termo)) {
            listaParaExibir.push({ ...item, agenda: nomeAgenda, indexOriginal: index });
          }
        });
      });
    } else {
      (baseAgendas[agendaAtual] || []).forEach((item, index) => {
        listaParaExibir.push({ ...item, agenda: agendaAtual, indexOriginal: index });
      });
    }

    listaParaExibir.forEach((item) => {
      const partesData = item.dataNasc.split('-');
      const dataFormatada = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="badge-agenda">${item.agenda}</span></td>
        <td><strong>${item.nome}</strong></td>
        <td>🎂 ${dataFormatada}</td>
        <td>${item.obs}</td>
        <td class="action-btns">
          <button class="btn-edit" onclick="editarAniversario('${item.agenda}', ${item.indexOriginal})">✏️ Editar</button>
          <button class="btn-delete" onclick="excluirAniversario('${item.agenda}', ${item.indexOriginal})">🗑️ Excluir</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function editarAniversario(agenda, index) {
    agendaAtual = agenda;
    document.getElementById('agendaSelect').value = agenda;

    const item = baseAgendas[agenda][index];
    document.getElementById('nome').value = item.nome;
    document.getElementById('dataNasc').value = item.dataNasc;
    document.getElementById('obs').value = item.obs;
    document.getElementById('editIndex').value = index;
  }

  function excluirAniversario(agenda, index) {
    if (confirm('Deseja realmente excluir este aniversário?')) {
      baseAgendas[agenda].splice(index, 1);
      atualizarStorageLocal();
      atualizarSelectAgendas();
      renderizarTabela();
    }
  }

  function consultarAniversarios() { renderizarTabela(); }

  function limparFormulario() {
    document.getElementById('nome').value = '';
    document.getElementById('dataNasc').value = '';
    document.getElementById('obs').value = '';
    document.getElementById('editIndex').value = '-1';
  }

  function atualizarStorageLocal() {
    localStorage.setItem('niver_agendas_db', JSON.stringify(baseAgendas));
  }

  function exportarICS() {
    const listaAtual = baseAgendas[agendaAtual] || [];
    if (listaAtual.length === 0) {
      alert(`Nenhum aniversário na agenda "${agendaAtual}" para exportar!`);
      return;
    }

    let icsData = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Reinaldo Pinheiro Consultoria//NIVER App//PT\n";
    listaAtual.forEach(item => {
      const [ano, mes, dia] = item.dataNasc.split('-');
      const anoAtual = new Date().getFullYear();
      icsData += "BEGIN:VEVENT\n";
      icsData += `SUMMARY:🎂 Aniversário de ${item.nome} (${agendaAtual})\n`;
      icsData += `DESCRIPTION:${item.obs}\n`;
      icsData += `DTSTART;VALUE=DATE:${anoAtual}${mes}${dia}\n`;
      icsData += `RRULE:FREQ=YEARLY\n`;
      icsData += "END:VEVENT\n";
    });
    icsData += "END:VCALENDAR";

    downloadArquivo(icsData, `aniversarios_${agendaAtual.toLowerCase()}.ics`, "text/calendar");
  }

  function exportarBackupJSON() {
    const dataStr = JSON.stringify(baseAgendas, null, 2);
    downloadArquivo(dataStr, "dados_niver.json", "application/json");
  }

  function downloadArquivo(conteudo, nomeArquivo, tipo) {
    const blob = new Blob([conteudo], { type: tipo });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = nomeArquivo;
    link.click();
  }

  // Sincronização direta via API do GitHub usando o Token decodificado
  async function salvarNoGitHubDirect() {
    const token = obterToken();

    if (!token || token === "COLE_AQUI_SEU_TOKEN_EM_BASE64") {
      alert("Erro: O Token do GitHub não foi configurado corretamente no código Base64!");
      return;
    }

    const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(baseAgendas, null, 2))));
    const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

    try {
      let sha = "";
      const getFileResp = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (getFileResp.ok) {
        const fileData = await getFileResp.json();
        sha = fileData.sha;
      }

      const body = {
        message: `Atualização de aniversários via NIVER App`,
        content: contentEncoded,
        sha: sha !== "" ? sha : undefined
      };

      const putResp = await fetch(url, {
        method: "PUT",
        headers: { 
          "Authorization": `token ${token}`, 
          "Content-Type": "application/json" 
        },
        body: JSON.stringify(body)
      });

      if (putResp.ok) {
        alert("🎉 Sucesso! As agendas e aniversários foram salvos no repositório GitHub!");
      } else {
        const errData = await putResp.json();
        alert("Erro ao salvar no GitHub: " + (errData.message || "Verifique o token informado"));
      }
    } catch (err) {
      alert("Erro de conexão ao salvar no GitHub: " + err.message);
    }
  }

  inicializar();
</script>

</body>
</html>
