<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas-vindas ao Canal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }
        h2 {
            color: #075e54;
            margin-bottom: 15px;
        }
        p {
            color: #555555;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        button {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1ebc57;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Seja muito bem-vindo(a)!</h2>
        <p>Acompanhe nossas novidades, conteúdos e atualizações exclusivas diretamente no nosso canal do WhatsApp.</p>
        <button onclick="acessarCanal()">OK, Acessar Canal</button>
    </div>

    <script>
        function acessarCanal() {
            window.location.href = "https://whatsapp.com/channel/0029Vb6APZRDZ4LWNk9YII0a";
        }
    </script>

</body>
</html>
